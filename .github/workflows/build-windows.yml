name: Gerar ExifBoost-Pro.exe (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'icon_data.py'
      - 'exifboost_launcher.py'
      - 'requirements.txt'
      - 'templates/**'
      - 'static/**'
      - '.github/smoke_test.py'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Gerar o ícone
        run: >
          python -c "from PIL import Image; im = Image.open('static/icon_rfa.png').convert('RGBA').resize((256, 256), Image.LANCZOS); im.save('icon.ico', sizes=[(256, 256), (64, 64), (48, 48), (32, 32), (16, 16)])"

      - name: Empacotar
        run: >
          pyinstaller --noconfirm --onefile --name ExifBoost-Pro --icon icon.ico
          --add-data "templates;templates" --add-data "static;static"
          exifboost_launcher.py

      - name: Teste de fumaça (abre o .exe, processa uma foto e confere os metadados)
        shell: pwsh
        run: |
          $env:EXIFBOOST_NO_BROWSER = '1'
          $app = Start-Process -FilePath 'dist\ExifBoost-Pro.exe' -PassThru -WindowStyle Hidden
          try {
            python .github/smoke_test.py
            if ($LASTEXITCODE -ne 0) { throw 'Teste de fumaça falhou' }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ExifBoost-Pro-Windows
          path: dist/ExifBoost-Pro.exe

      - name: Publicar na página de Lançamentos (só a partir da main, depois do teste passar)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notas.md <<EOF
          Instalador do **ExifBoost Pro** para Windows, sem precisar instalar o Python.
          Versão mais recente, gerada a partir do commit \`${GITHUB_SHA::7}\`.

          **Como usar**
          1. Baixe o arquivo \`ExifBoost-Pro.exe\` abaixo.
          2. Dê duplo clique. O app abre no navegador, em um endereço local (127.0.0.1).
          3. Para encerrar, feche a janela preta do programa.

          **Aviso do Windows:** como o arquivo não é assinado digitalmente, o Windows pode mostrar "O Windows protegeu o computador" (SmartScreen). Clique em **Mais informações** e depois em **Executar assim mesmo**. O antivírus também pode pedir confirmação.

          Os modelos salvos ficam em \`C:\\Users\\SEU-USUARIO\\.exifboost_pro\`.
          EOF
          gh release delete windows-latest --cleanup-tag --yes || true
          gh release create windows-latest dist/ExifBoost-Pro.exe --title "ExifBoost Pro para Windows (versão mais recente)" --notes-file notas.md --target "$GITHUB_SHA"
